name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '36 23 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Both halves of the codebase: the Go service and the React/TypeScript SPA in
        # webui/. `include` rather than a bare list because the two need different build
        # modes — Go has to be compiled for CodeQL to see it, JavaScript/TypeScript is
        # analysed from source and must NOT be built.
        #
        # What each leg reads is bounded by .github/codeql/codeql-config.yml, which keeps
        # the javascript-typescript leg off the minified bundle in web/dist.
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Go only. Autobuild runs `go build`, which compiles package web and embeds web/dist
    # via `//go:embed all:dist`. The committed copy of that directory is a convenience for
    # building without a Node toolchain and carries no guarantee of being current, so build
    # it here as every other workflow does — the analysis then covers the same tree a
    # release would ship. Runs before init so the npm work stays outside the traced build.
    #
    # The javascript-typescript leg deliberately skips this: it reads webui/src, and
    # installing node_modules or generating a bundle would only give it more to ignore.
    - name: Setup Node
      if: matrix.language == 'go'
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: webui/package-lock.json

    - name: Build web UI
      if: matrix.language == 'go'
      run: |
        cd webui
        npm ci
        npm run build

    # Initializes the CodeQL tools for scanning. `build-mode` replaces the separate
    # Autobuild step this workflow used to run: init performs the autobuild for the Go
    # leg, and does nothing to build the JavaScript one.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml
        # To widen the query set beyond the default, prefix with "+" to keep the
        # defaults as well: queries: +security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
