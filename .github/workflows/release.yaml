name: Release GO binaries

on:
  release:
    types: [published]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows]
        goarch: ["386", amd64, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: arm
    steps:
    - uses: actions/checkout@v4

    # The binary embeds web/dist (package web, `//go:embed all:dist`), and that
    # directory is committed only so `go build` works without a Node toolchain —
    # nothing guarantees the commit's copy matches webui/. Building it here is what
    # stops a release binary shipping a stale UI; the Docker images get the same
    # guarantee from the Dockerfile's own web stage.
    #
    # A step rather than the action's `pre_command`: that runs inside the action's Go
    # container, which has no Node in it.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webui/package-lock.json

    - name: Build web UI
      run: |
        cd webui
        npm ci
        npm run build

    - uses: wangyoucao577/go-release-action@v1.53
      with:
        github_token: ${{ secrets.GIT_HUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "1.25.0"
        binary_name: "autotaggerr"
        ldflags: "-s -w"
        extra_files: README.md auth collection components database events files health logger mail metadata migration mirror models modules process routers settings utilities web Dockerfile entrypoint.sh
        retry: 10
        overwrite: true
        release_name: ${{ github.ref_name }}
        pre_command: sed -i 's/{{RELEASE_TAG}}/${{ github.event.release.tag_name }}/g' files/config.go # Replace release variable with the name of this release