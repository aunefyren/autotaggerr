name: Release GO binaries

on:
  release:
    types: [published]

jobs:
  # The binary embeds web/dist (package web, `//go:embed all:dist`), and that directory
  # is committed only so `go build` works without a Node toolchain — nothing guarantees
  # the commit's copy matches webui/. Building it here is what stops a release binary
  # shipping a stale UI; the Docker images get the same guarantee from the Dockerfile's
  # own web stage.
  #
  # Its own job rather than a step inside the matrix, for the same reason the Dockerfile
  # pins its web stage to $BUILDPLATFORM: the bundle is byte-identical for every os/arch,
  # so building it per matrix leg would run the same npm install and vite build six times
  # to produce six identical directories. Building it once also guarantees every released
  # binary embeds the *same* bundle.
  #
  # Node 22 — matching CI and the Dockerfile's node:22-slim. vite 8 requires
  # ^20.19.0 || >=22.12.0 and npm refuses the install below that.
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        run: |
          cd webui
          npm ci
          npm run build

      # if-no-files-found: error, so a build that silently produced nothing fails here
      # rather than six legs later as a confusing go:embed error.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  releases-matrix:
    name: Release Go Binary
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows]
        goarch: ["386", amd64, arm64, arm]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: arm
    steps:
    - uses: actions/checkout@v7

    # The checkout carries the committed web/dist, which may be stale. Clear it before
    # restoring the freshly built one: `npm run build` gets this for free from vite's
    # emptyOutDir, but download-artifact only overwrites the files it brings, so a hashed
    # asset that no longer exists would otherwise linger beside the new bundle and be
    # embedded and shipped.
    - name: Drop the committed bundle
      run: rm -rf web/dist

    # go-release-action builds from $GITHUB_WORKSPACE — it does not check out again — so
    # what lands here is what gets embedded. It must land before the action runs.
    - name: Restore web UI bundle
      uses: actions/download-artifact@v8
      with:
        name: web-dist
        path: web/dist

    - uses: wangyoucao577/go-release-action@v1.53
      with:
        github_token: ${{ secrets.GIT_HUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "1.25.0"
        binary_name: "autotaggerr"
        ldflags: "-s -w"
        extra_files: README.md auth collection components database events files health logger mail metadata migration mirror models modules process routers settings utilities web Dockerfile entrypoint.sh
        retry: 10
        overwrite: true
        release_name: ${{ github.ref_name }}
        pre_command: sed -i 's/{{RELEASE_TAG}}/${{ github.event.release.tag_name }}/g' files/config.go # Replace release variable with the name of this release
